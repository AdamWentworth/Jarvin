<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title description">
  <title id="title">Jarvin</title>
  <desc id="description">Jarvin is a private, local-first personal AI assistant for voice, chat, memory, and safe host tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c0f"/>
      <stop offset="0.58" stop-color="#111318"/>
      <stop offset="1" stop-color="#171014"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e77a4a"/>
      <stop offset="0.55" stop-color="#d85d33"/>
      <stop offset="1" stop-color="#b83f2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d85d33" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#d85d33" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#f4ead1" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1600" height="460" rx="28" fill="url(#background)"/>
  <rect width="1600" height="460" rx="28" fill="url(#grid)"/>
  <ellipse cx="1360" cy="76" rx="390" ry="300" fill="url(#glow)"/>
  <ellipse cx="160" cy="436" rx="330" ry="250" fill="url(#glow)" opacity="0.52"/>

  <g transform="translate(108 91)" filter="url(#shadow)">
