    <text x="-6" y="150" fill="#fff6e8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="126" font-weight="800" letter-spacing="-5">JARVIN</text>
    <text x="0" y="205" fill="#d8d1c4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="500">A host-run personal AI assistant for voice, chat, memory, and safe tools.</text>

    <g transform="translate(0 244)">
      <rect width="168" height="46" rx="23" fill="#20242b" stroke="#f4ead1" stroke-opacity="0.09"/>
