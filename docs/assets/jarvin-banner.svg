      <text x="227" y="30" fill="#f4ead1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">VOICE FIRST</text>

      <rect x="368" width="187" height="46" rx="23" fill="#20242b" stroke="#f4ead1" stroke-opacity="0.09"/>
      <circle cx="394" cy="23" r="6" fill="#d3a62d"/>
      <text x="413" y="30" fill="#f4ead1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">APPROVAL SAFE</text>
