    <rect x="16" y="16" width="246" height="246" rx="59" fill="url(#accent)"/>
    <path d="M95 69h93v93c0 40-24 65-65 65-25 0-44-8-58-25l32-29c8 10 17 15 27 15 16 0 24-10 24-30V106H95V69Z" fill="#fff7ec"/>
    <path d="M77 135v26M62 143v10M213 135v26M228 143v10" stroke="#fff7ec" stroke-width="10" stroke-linecap="round" opacity="0.78"/>
