version: 2

# Keep dependency visibility without routine bot-authored version-update PRs.
# Dependabot alerts remain enabled; dependency changes are reviewed and authored manually.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /clients/jarvin-ui
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /clients/jarvin-ui/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 0
