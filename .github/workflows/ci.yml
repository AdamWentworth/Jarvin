name: CI Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "setuptools<81" wheel
        python -m pip install --no-build-isolation -r requirements-ci.txt

    - name: Install project
      run: python -m pip install -e .

    - name: Run tests
      run: |
        pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: clients/jarvin-ui

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: clients/jarvin-ui/package-lock.json

    - name: Install frontend dependencies
      run: npm ci

    - name: Type-check and build shared client
      run: npm run build
